name: Deploy compiled talk to personal website

on:
  push:
    branches: [main]
    paths:
      - talk.qmd
      - _quarto.yml
      - theme.scss
      - styles.css
      - assets/**
      - scripts/build_website_talk.py
      - .github/workflows/deploy-talk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-talk-website
  cancel-in-progress: false

env:
  WEBSITE_REPOSITORY: jcockayne/jcockayne.github.io
  WEBSITE_BRANCH: github.io
  WEBSITE_DIRECTORY: talks/osaka_talk_2026

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out talk source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: talk
          persist-credentials: false
      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: '1.10.18'
      - name: Check out website branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.WEBSITE_REPOSITORY }}
          ref: ${{ env.WEBSITE_BRANCH }}
          path: website
          ssh-key: ${{ secrets.WEBSITE_DEPLOY_KEY }}
      - name: Compile and copy talk
        run: python3 talk/scripts/build_website_talk.py --website-dir website --destination "$WEBSITE_DIRECTORY"
      - name: Commit and push compiled talk
        working-directory: website
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$WEBSITE_DIRECTORY/index.html"
          if git diff --cached --quiet; then
            echo 'Compiled talk is already up to date.'
            exit 0
          fi
          git commit -m "Update compiled Osaka talk from $GITHUB_SHA"
          git push origin "HEAD:$WEBSITE_BRANCH"
